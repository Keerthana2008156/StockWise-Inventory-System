
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | StockWise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="form-page">
      <a href="{{ url_for('index') }}" class="back-link">← Back to Dashboard</a>

        <section class="form-card">
            <p class="eyebrow">INVENTORY MANAGEMENT</p>
            <h1>Add New Product</h1>
            <p class="form-subtitle">Enter the product details below.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('add_product') }}">
                <label for="product_name">Product Name</label>
                <input type="text" id="product_name" name="product_name"
                       placeholder="e.g. Wireless Keyboard" required>

                <label for="sku">SKU / Product Code</label>
                <input type="text" id="sku" name="sku"
                       placeholder="e.g. ELEC005" required>

                <label for="category_id">Category</label>
                <select id="category_id" name="category_id" required>
                    <option value="">Select a category</option>
                    {% for category in categories %}
                        <option value="{{ category.category_id }}">
                            {{ category.category_name }}
                        </option>
                    {% endfor %}
                </select>

                <div class="form-grid">
                    <div>
                        <label for="opening_stock">Opening Stock</label>
                        <input type="number" id="opening_stock" name="opening_stock"
                               min="0" value="0" required>
                    </div>
                    <div>
                        <label for="reorder_level">Reorder Level</label>
                        <input type="number" id="reorder_level" name="reorder_level"
                               min="0" value="5" required>
                    </div>
                </div>

                <label for="unit_cost">Unit Cost (₹)</label>
                <input type="number" id="unit_cost" name="unit_cost"
                       min="0" step="0.01" placeholder="e.g. 499.00" required>

                <button type="submit" class="submit-button">＋ Add Product</button>
            </form>
        </section>
    </main>
</body>
</html>
