
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockWise | Edit Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="app-shell">

    <aside class="sidebar">
        <div class="brand">
            <h2>StockWise</h2>
            <p>Inventory Management</p>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-link" href="{{ url_for('index') }}">▦ Dashboard</a>
            <a class="nav-link" href="{{ url_for('add_product') }}">＋ Add Product</a>
            <a class="nav-link" href="{{ url_for('transactions') }}">⇄ Stock Transactions</a>
            <a class="nav-link" href="{{ url_for('analysis') }}">▤ Product Analysis</a>
        </nav>

        <div class="sidebar-footer">
            <p>StockWise Inventory System</p>
        </div>
    </aside>

    <main class="main-content">

        <header class="page-header">
            <div>
                <p class="eyebrow">PRODUCT MANAGEMENT</p>
                <h1>Edit Product</h1>
                <p>Update product information.</p>
            </div>
        </header>

        <section class="movement-panel">

            <form method="POST">

                <label>SKU</label>
                <input type="text" name="sku"
                       value="{{ product.sku }}" required>

                <label>Product Name</label>
                <input type="text" name="product_name"
                       value="{{ product.product_name }}" required>

                <label>Category</label>
                <select name="category_id" required>
                    {% for category in categories %}
                    <option value="{{ category.category_id }}"
                        {% if category.category_id == product.category_id %}
                            selected
                        {% endif %}>
                        {{ category.category_name }}
                    </option>
                    {% endfor %}
                </select>

                <label>Opening Stock</label>
                <input type="number" name="opening_stock"
                       min="0" value="{{ product.opening_stock }}" required>

                <label>Reorder Level</label>
                <input type="number" name="reorder_level"
                       min="0" value="{{ product.reorder_level }}" required>

                <label>Unit Cost</label>
                <input type="number" name="unit_cost"
                       min="0" step="0.01"
                       value="{{ product.unit_cost }}" required>

                <br><br>

                <button type="submit" class="add-product-button">
                    Update Product
                </button>

                <a href="{{ url_for('index') }}" class="add-product-button">
                    Cancel
                </a>

            </form>

        </section>

    </main>
</div>
</body>
</html>
